<!-- A category's monthly budget: spent-so-far above a two-segment bar (solid
     for recorded spending, lighter for upcoming) and the remaining/over line
     below. .upcoming-note is removed when nothing is pending this month. -->
<button type="button" class="budget-row">
  <div class="budget-top-wrapper">
    <div class="budget-top">
      <span class="name"></span>
      <span class="recorded"></span>
      <div class="upcoming-note"></div>
    </div>
  </div>
  <div class="bar">
    <div class="bar-fill"></div>
    <div class="bar-fill-upcoming"></div>
  </div>
  <div class="budget-bottom">
    <span class="budget-remaining"></span>
    <span class="budget-total"></span>
  </div>
</button>
