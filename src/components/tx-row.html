<!-- One transaction in a list. The type (expense/income/transfer) is added as
     a class to .tx-dot, .category-tag and .tx-amount; .due-badge is removed
     for anything that isn't still pending. -->
<div class="tx-row">
  <div class="tx-dot"></div>
  <div class="tx-main">
    <div class="tx-title"></div>
    <div class="tx-sub">
      <div class="tx-tags">
        <span class="due-badge"></span>
        <span class="category-tag"></span>
      </div>
      <span class="tx-sub-text"></span>
    </div>
  </div>
  <div class="tx-amount"></div>
</div>
