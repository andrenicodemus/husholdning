<!-- An applied filter, shown as a removable pill in #view-all's tag row.
     The label is plain text; the ✕ button is the only interactive part. -->
<span class="filter-tag">
  <span class="filter-tag-label"></span>
  <button class="filter-tag-remove" type="button">
    <svg class="icon" aria-hidden="true" focusable="false">
      <use href="src/icons/sprite.svg#close"></use>
    </svg>
  </button>
</span>
