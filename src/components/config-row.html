<!-- A tappable settings list row (Settings › Accounts, Settings › Categories):
     name, a meta line, and a chevron hinting it opens an edit dialog. -->
<button type="button" class="acct-row">
  <div class="acct-info">
    <div class="acct-name"></div>
    <div class="acct-meta"></div>
  </div>
  <div class="acct-chevron" aria-hidden="true">
    <svg class="icon" aria-hidden="true" focusable="false">
      <use href="src/icons/sprite.svg#chevron-right"></use>
    </svg>
  </div>
</button>
