<!-- An account in the Accounts view: name/owner on the left, balance on the
     right. .projected is removed unless the account has upcoming transactions. -->
<button type="button" class="acct-row">
  <div class="acct-info">
    <div class="acct-name"></div>
    <div class="acct-meta"></div>
  </div>
  <div class="acct-right">
    <div class="acct-bal"></div>
    <div class="projected"></div>
  </div>
</button>
