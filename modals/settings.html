<div class="row2">
  <div><div class="field-label">Name A</div><input class="text-input" id="m-na" /></div>
  <div><div class="field-label">Name B</div><input class="text-input" id="m-nb" /></div>
</div>
<div class="row2" style="margin-top: 4px">
  <div>
    <div class="field-label">Currency</div>
    <input class="text-input" id="m-cur" maxlength="3" autocapitalize="characters" />
  </div>
  <div>
    <div class="field-label">PIN</div>
    <input class="text-input" id="m-pin" inputmode="numeric" />
  </div>
</div>
<div class="actions" style="display: flex; flex-direction: column; row-gap: 8px">
  <button class="btn-primary" id="m-save">Save settings</button>
  <button class="btn-ghost" id="m-resync">Force full resync</button>
  <button class="btn-danger" id="m-disconnect">Disconnect from sheet</button>
</div>
