<div id="m-card">
  <div class="form-group">
    <div class="amount-wrap">
      <input class="amount-input" id="m-amount" inputmode="numeric" />
      <div class="amount-currency" id="m-amount-cur"></div>
    </div>
    <div id="m-wrap-category">
      <div class="field-label">Category</div>
      <div class="chips" id="m-chips-category"></div>
    </div>
    <div id="m-wrap-from">
      <div class="field-label" id="m-label-from">From account</div>
      <div class="chips" id="m-chips-from"></div>
    </div>
    <div id="m-wrap-to" style="display: none">
      <div class="field-label" id="m-label-to">To account</div>
      <div class="chips" id="m-chips-to"></div>
    </div>
    <div class="row2">
      <div>
        <div class="field-label" style="margin-top: 0">Date</div>
        <input class="text-input" type="date" id="m-date" />
      </div>
      <div>
        <div class="field-label" style="margin-top: 0">Note</div>
        <input class="text-input" id="m-note" placeholder="Optional" />
      </div>
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn-primary" id="m-save">Save changes</button>
    <button class="btn-danger" id="m-del">Delete transaction</button>
  </div>
</div>
